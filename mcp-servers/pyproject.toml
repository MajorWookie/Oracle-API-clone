[project]
name = "oracle-fusion-mcp"
version = "0.1.0"
description = "MCP servers exposing the Oracle Fusion Cloud REST APIs (SCM, CX, Common Features)"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3,<4",
    "httpx>=0.27",
]

[project.scripts]
oracle-fusion-scm-mcp = "oracle_fusion_mcp.entry:run_scm"
oracle-fusion-cx-mcp = "oracle_fusion_mcp.entry:run_cx"
oracle-fusion-common-mcp = "oracle_fusion_mcp.entry:run_common"
oracle-fusion-build-index = "oracle_fusion_mcp.build_index:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle_fusion_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
